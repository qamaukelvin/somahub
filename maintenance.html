<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somahub — Temporarily Unavailable</title>
<meta http-equiv="refresh" content="120">
<link rel="icon" type="image/x-icon" href="favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>

  .brand .dot{width:11px;height:11px;background:var(--amber);border-radius:50%;}

  p{color:#BFD8D9;font-size:0.95rem;line-height:1.6;margin-bottom:28px;}
  a.wa{display:inline-block;background:#25D366;color:#fff;padding:12px 24px;border-radius:24px;font-weight:700;font-size:0.88rem;text-decoration:none;}
  .note{margin-top:24px;font-size:0.78rem;color:#7FA5A6;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span> somahub</div>

  </div>
</body>
</html>
